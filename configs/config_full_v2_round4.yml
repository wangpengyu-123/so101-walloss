# SO-ARM101 real-data LoRA fine-tune — ROUND 4 (fixed-orientation, strictly open-source post-record flow)
#
# vs config_full_v2_round2.yml — ONLY 4 changes (per approved plan):
#   1. data.lerobot_config.root      -> so101_real_round4  (raw v2.1, NO unify/_rgb)
#   2. data.key_mappings.camera      -> no ".rgb" suffix (v2.1 keys: observation.images.global / .wrist)
#   3. data.norm_stats_path          -> norm_stats_round4.json
#   4. checkpoint.save_path          -> output_full_v4
#   (log_name cosmetic -> so101_ft_v4)
#
# Everything else unchanged: dof/agent_pos = so101_joint_pos:6 + action_padding:20,
# LoRA (qkv_proj_experts + w1/w2/w3/action_proj_back + propri_proj full-param),
# 30001 steps, save_interval 5000, norm-key so101_table_pick_place (repo_id), sdpa inference.
#
# Camera order matters: global first, then wrist (matches meta.camera_keys insertion order).

model_type: qwen2_5

task:
  dof_config:
    so101_joint_pos: 6
    action_padding: 20
  ar_dof_config:
    so101_joint_pos: 6
    action_padding: 20
  agent_pos_config:
    so101_joint_pos: 6
    action_padding: 20
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /root/autodl-tmp/wallx_ft/weights/wall-oss-0.5/config.json
  processor_path: /root/autodl-tmp/wallx_ft/weights/Qwen2.5-VL-3B-Instruct
  pretrained_path: /root/autodl-tmp/wallx_ft/weights/Qwen2.5-VL-3B-Instruct
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
  # LoRA: injected AFTER pretrain weight loading (see FSDPTrainer._inject_lora_if_needed)
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_target_modules: ["qkv_proj_experts.0", "qkv_proj_experts.1"]
  lora_action_head_target_modules: ["w1", "w2", "w3", "action_proj_back"]
  full_param_train_keywords: ["propri_proj"]
  lora_dropout: 0.05

hyperparams:
  num_epoch: 300
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 4
  seed: 10222
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 1000
    num_training_steps: 30001
    min_lr: 1.0e-6

distributed:
  use_fsdp: false
  use_mixed_precision: true
  bf16: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: so101_table_pick_place
    root: /root/autodl-tmp/wallx_ft/data/so101_real_round4
  key_mappings:
    camera:
      observation.images.global: global_view
      observation.images.wrist: wrist_view
    state: observation.state
    action: action
  norm_stats_path: /root/autodl-tmp/wallx_ft/data/norm_stats_round4.json
  train_test_split: 0.95
  num_workers: 4
  max_length: 1024
  resolution:
    global_view: 256
    wrist_view: 256

logging:
  log_name: so101_ft_v4
  log_project: so101_walloss
  log_entity: null
  use_wandb: false
  log_interval: 10
  save_interval: 5000
  val_interval: 1000000
  epoch_save_interval: 1

checkpoint:
  save_path: /root/autodl-tmp/wallx_ft/output_full_v4
  resume_from: /root/autodl-tmp/wallx_ft/weights/wall-oss-0.5/model.safetensors

debug:
  profile: false
  nvtx: false
