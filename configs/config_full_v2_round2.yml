# SO-ARM101 real-data LoRA fine-tune — ROUND 2 (Plan A) — dual-camera (global+wrist)
# Fixes the round-1 bug where the action head (ActionProcessor) was trained by
# the optimizer but its full-param update was dropped by the merge script.
#
# What changed vs config_full.yml:
#   model.lora_target_modules            : unchanged (backbone attention QKV experts)
#   model.lora_action_head_target_modules: NEW — LoRA the action head Linear layers
#                                          that HAVE pretrained weights
#   model.full_param_train_keywords      : NEW — keep propri_proj full-param trainable
#                                          (random-init, cannot be LoRA'd)
#   data.lerobot_config.root             : round2 dual-camera dataset
#   data.key_mappings.camera             : + observation.images.wrist.rgb -> wrist_view
#   data.resolution                      : + wrist_view: 256
#   data.norm_stats_path                 : round2 norm_stats_round2.json
#
# Requires the 4 source patches under patches/ (see README.md).

model_type: qwen2_5

task:
  dof_config:
    so101_joint_pos: 6
    action_padding: 20
  ar_dof_config:
    so101_joint_pos: 6
    action_padding: 20
  agent_pos_config:
    so101_joint_pos: 6
    action_padding: 20
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /root/autodl-tmp/wallx_ft/weights/wall-oss-0.5/config.json
  processor_path: /root/autodl-tmp/wallx_ft/weights/Qwen2.5-VL-3B-Instruct
  pretrained_path: /root/autodl-tmp/wallx_ft/weights/Qwen2.5-VL-3B-Instruct
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
  # LoRA: injected AFTER pretrain weight loading (see FSDPTrainer._inject_lora_if_needed)
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  # Backbone attention MoE QKV experts (same as round 1).
  lora_target_modules: ["qkv_proj_experts.0", "qkv_proj_experts.1"]
  # Plan A: also LoRA the action head projection layers that have pretrained
  # weights (w1 52->1024, w2 2048->1024, w3 1024->1024, action_proj_back
  # 1024->26). These are the ActionProcessor leaf Linear names.
  lora_action_head_target_modules: ["w1", "w2", "w3", "action_proj_back"]
  # Random-init layers that must train full-param (propri_proj 52->2048).
  full_param_train_keywords: ["propri_proj"]
  lora_dropout: 0.05

hyperparams:
  num_epoch: 300
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 4
  seed: 10222
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 1000
    num_training_steps: 30001
    min_lr: 1.0e-6

distributed:
  use_fsdp: false
  use_mixed_precision: true
  bf16: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: so101_table_pick_place
    root: /root/autodl-tmp/wallx_ft/data/so101_real_round2_rgb
  key_mappings:
    camera:
      observation.images.global.rgb: global_view
      observation.images.wrist.rgb: wrist_view
    state: observation.state
    action: action
  norm_stats_path: /root/autodl-tmp/wallx_ft/data/norm_stats_round2.json
  train_test_split: 0.95
  num_workers: 4
  max_length: 1024
  resolution:
    global_view: 256
    wrist_view: 256

logging:
  log_name: so101_ft_v2
  log_project: so101_walloss
  log_entity: null
  use_wandb: false
  log_interval: 10
  save_interval: 5000
  val_interval: 1000000
  epoch_save_interval: 1

checkpoint:
  save_path: /root/autodl-tmp/wallx_ft/output_full_v2
  resume_from: /root/autodl-tmp/wallx_ft/output_full_v2/42/

debug:
  profile: false
  nvtx: false
